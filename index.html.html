<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy English – Hospitality OJT Interview Q&amp;A</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d0a52;--bg2:#2a1470;--card:#2b1673;--line:#3c63d9;--tx:#fff;--mut:#c9c2ee;--blue:#2b9bff;--org:#ff9a1f;--yel:#ffee00;--ink:#1d0a52;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1efff;--bg2:#e3deff;--card:#fff;--line:#2b6fe0;--tx:#1d0a52;--mut:#5a4d99}}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;font-weight:500}
header{text-align:center;padding:22px 18px 8px}
header img{width:84px;height:84px;border-radius:20px;box-shadow:0 0 0 2px var(--blue)}
h1{font-size:22px;font-weight:800;margin:12px 0 4px;line-height:1.2}
header p{margin:0;color:var(--mut);font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:2px solid var(--line)}
#q{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
#tabs button{flex:none;border:2px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
#tabs button[aria-selected=true]{background:var(--yel);color:var(--ink);border-color:var(--yel)}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
.intro{color:var(--mut);font-size:14px;margin:0 0 14px}
.item{background:var(--card);border-radius:14px;margin-bottom:10px;border-left:5px solid var(--org);overflow:hidden}
.item button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;width:100%;padding:14px;cursor:pointer;font-weight:700;font-size:15px}
.item button:focus-visible,#tabs button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.item .t{flex:1}.item .tag{display:block;font-size:11px;color:var(--org);font-weight:700;margin-bottom:2px}
.item .ar{color:var(--blue);font-weight:800;transition:transform .2s}
.item.open .ar{transform:rotate(90deg)}
.ans{display:none;padding:0 14px 14px;font-size:14.5px}
.item.open .ans{display:block}
.ans p{margin:0 0 8px}.ans em{color:var(--org);font-style:normal;font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border-top:4px solid var(--blue)}
.card h3{margin:0 0 6px;font-size:16px;font-weight:800}
.card ul{margin:0;padding-left:20px;font-size:14.5px}.card li{margin:4px 0}
.op{display:inline-block;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px}
.ans p+p{border-top:1px dashed var(--line);padding-top:8px}
.none{text-align:center;color:var(--mut);padding:24px 0}
footer{text-align:center;padding:18px;color:var(--mut);font-size:13px;border-top:2px solid var(--line)}
footer b{color:var(--yel)}
</style>
</head>

var S={g:"Umum",f:"F&B Service",h:"Housekeeping",b:"Bar",r:"Reception"};
var D={
g:[
["Tell me about yourself.","My name is ___. I’m a hospitality student at ___. I’m disciplined, friendly, and eager to learn, and I want to build real skills in a professional hotel."],
["Why do you want to do your OJT at our hotel?","Your hotel has a great reputation for service. I want to learn from professionals and apply what I studied in real situations."],
["Why did you choose this department?","I enjoy ___ (talking with guests / keeping things clean / making drinks), and I believe my skills fit this team."],
["What are your strengths?","I’m punctual, a fast learner, and a good team player. I stay calm when it’s busy."],
["What is your weakness?","I’m a little shy at first, but I practice speaking up and asking questions every day. <em>Tip:</em> pick a real weakness and show how you’re improving it."],
["What do you know about our hotel?","I know it’s a ___-star hotel in ___, known for ___. <em>Tip:</em> check the website and Instagram before the interview."],
["Are you ready to work shifts, weekends, and holidays?","Yes, I’m ready. I understand hospitality never stops, and I’m happy to be flexible."],
["How do you handle pressure or being corrected by a senior?","I listen carefully, say “thank you”, and fix it right away. Correction helps me grow."],
["How would you handle an angry guest?","I stay calm and listen, apologize sincerely, never argue, offer a solution, and call my supervisor if needed."],
["What are your goals for this OJT?","To improve my skills and my English, learn hotel standards, and become a reliable team member."]],
h:[
["What do you know about the Housekeeping department?","Housekeeping keeps guest rooms and public areas clean, tidy, and comfortable. It is the heart of guest comfort."],
["Why Housekeeping and not Front Office?","I love detail work and the satisfaction of a perfect room. Cleanliness and quality are my passion."],
["Are you ready for physical work?","Yes. I’m healthy and I know how to lift correctly and keep good posture."],
["How do you clean a guest room?","I knock and announce, open the curtains, strip the bed, dust from top to bottom, clean the bathroom, make the bed, vacuum, and do a final check."],
["What would you do if you found money or a valuable item in a room?","I leave it as it is, report to my supervisor immediately, and record it in the lost and found log. Honesty comes first."],
["A guest is still in the room when you come to clean. What do you do?","I greet politely, ask if I may come back later, and return at a better time. The guest’s privacy comes first."],
["What would you do if you find damage or a serious stain?","I report to my supervisor, record it by the hotel procedure, and never hide it."],
["Why is a neat bed important?","It’s the first thing guests notice. It shows our quality and cleanliness standard."],
["How do you keep safe at work?","I wear gloves and non-slip shoes, use correctly labeled chemicals, lift with my legs, and put up wet floor signs."],
["It’s almost the end of your shift and your rooms are not finished. What do you do?","I prioritize rooms for arriving guests, tell my supervisor, and ask for help. I never skip quality."]],
f:[
["What does a waiter or waitress do?","They welcome guests, take orders, serve food and drinks, and make sure guests enjoy their meal."],
["Why F&B Service?","I love meeting people and serving them. It’s fast and exciting, and I can build service and communication skills."],
["How do you greet a guest?","Smile, make eye contact: “Good evening, welcome to ___. Do you have a reservation?” Then show them to a table."],
["A guest asks about an ingredient and you don’t know the answer. What do you do?","“Let me check with the chef to be sure.” I never guess, especially about allergies."],
["A guest says the food is cold or the order is wrong. What do you do?","“I’m so sorry, let me fix it right away.” I take the dish back, inform the kitchen and my supervisor, and follow up with the guest."],
["How do you maintain hygiene?","I wash my hands often, keep my uniform clean, tie my hair, keep nails short, and clean surfaces."],
["The restaurant is very busy and you feel overwhelmed. What do you do?","I stay calm, prioritize tasks, communicate with my team, and ask for help."],
["How do you carry a tray safely?","Balance it on my palm, keep it close to my body, put heavy items in the center, say “behind you”, and walk slowly."],
["What is upselling? Give an example.","Suggesting extra items or upgrades. Example: “Would you like a fresh juice or a dessert with your meal?”"],
["What would you do if a guest is rude or shouting?","I stay polite, don’t take it personally, let the guest finish, try to solve the problem, and call my supervisor if needed."]],
b:[
["Why are you interested in the Bar?","I enjoy creativity, learning about drinks, and talking with guests in a lively place."],
["What does a bartender do?","Prepares and serves drinks, keeps the bar clean and stocked, and creates a welcoming atmosphere."],
["Which cocktails or drinks do you know?","Mojito, Margarita, Cosmopolitan, Piña Colada, Old Fashioned, and mocktails like Virgin Mojito. <em>Tip:</em> only name drinks you can explain."],
["What is the difference between shaking, stirring, and building?","<em>Shaking:</em> shaker with ice, for juice or cream. <em>Stirring:</em> mixing glass, for spirit-only drinks. <em>Building:</em> pour straight into the serving glass."],
["A guest looks drunk and asks for another drink. What do you do?","I politely refuse more alcohol, offer water or a non-alcoholic drink, and inform my supervisor. Guest safety comes first."],
["A guest looks underage and orders alcohol. What do you do?","I politely ask for ID. If the guest is underage or has no ID, I refuse and offer a non-alcoholic option."],
["How do you keep the bar clean and hygienic?","I wipe surfaces, clean tools after each use, keep garnishes fresh, wash my hands, and use clean glassware."],
["The bar is full and orders are piling up. What do you do?","I prepare orders in sequence, stay calm and clean, ask for help, and tell guests the waiting time."],
["What would you do if you make a mistake in a recipe?","I admit it, remake the drink correctly, never serve a wrong drink, and learn the recipe again."],
["A guest asks for a recommendation. What do you say?","“Do you prefer sweet, sour, or strong? Light or heavy?” Then I suggest two options."]],
r:[
["What does a receptionist do?","Handles check-in and check-out, reservations, calls, and guest requests. The reception is the first and last impression of the hotel."],
["Why Reception / Front Office?","I enjoy meeting guests from many countries and practicing my English. I’m neat, patient, and good at solving problems."],
["How do you greet a guest at check-in?","Smile and say: “Good afternoon, welcome to ___. May I have your name, please?” Then check the reservation."],
["A guest arrives but you can’t find the reservation. What do you do?","I stay calm, check the name spelling and other dates, then ask my supervisor. I never blame the guest."],
["A guest complains about the room. What do you do?","I listen, apologize, and offer a solution, like a room change if available. I inform housekeeping and my supervisor."],
["How do you answer a phone call professionally?","“Good morning, ___ Hotel, [name] speaking. How may I help you?” Speak clearly, take notes, and repeat the details."],
["A guest asks for a late check-out. What do you say?","“Let me check availability for you.” If possible, I inform the policy and any fee. If not, I offer to keep the luggage."],
["How do you handle many guests at once?","I greet each guest, say “I’ll be with you in a moment”, serve one by one, and ask a colleague for help."],
["A person asks for another guest’s room number. What do you do?","I politely refuse for privacy: “I’m sorry, I can’t give that information. I can call the guest’s room for you.”"],
["What do you check during check-in?","ID or passport, booking details, payment or deposit, and the guest’s signature. Then give the key card and explain the facilities."]]
};

g:[["Hi, I’m ___ from ___ Hotel School. I love serving people and I’m ready to learn every day.","I’m ___, a hospitality student. I enjoy teamwork, I work hard, and I want to start my career in hotels."],
["I admire your service quality and want to learn your standards firsthand.","This OJT is my chance to turn theory into real hotel experience with your team."],
["It matches my skills and my interest, and I want to grow in it.","I tried it in school practice and loved it, so I want to go deeper."],
["I’m responsible and always on time.","I’m friendly and I communicate well with guests and colleagues."],
["I sometimes worry about making mistakes, so I double-check my work.","I’m still learning to multitask, so I make daily checklists."],
["I know your hotel has great facilities and good guest reviews. I want to be part of that quality.","I follow your social media and I’m impressed by your guest service and clean image."],
["Yes, I’m flexible, and my family supports my career.","Absolutely. Guests need service at any time, so I’m ready to adapt."],
["I take it as feedback, not criticism, and apply it immediately.","I stay calm, take a deep breath, and focus on one task at a time."],
["I use the LAST method: Listen, Apologize, Solve, Thank.","I let the guest speak, show empathy, then offer the best available solution."],
["I want to gain real experience and a good reference from your hotel.","I hope to master the basic standards and gain confidence in serving guests."]],
h:[["It’s the department that prepares clean rooms, laundry, and public areas every day.","Housekeeping makes every guest feel at home through cleanliness and care."],
["I like working behind the scenes and seeing clear results of my work.","I prefer systematic work, and Housekeeping gives me a strong hotel foundation."],
["Yes, I’m used to housework and I stay fit.","Yes. It’s tiring, but I’m disciplined and I take care of my body to stay safe."],
["I follow the checklist: bed, bathroom, dusting, floor, amenities, then inspection.","I start with trash and linen, clean the bathroom, refill amenities, and finish with the floor."],
["I report it right away to my supervisor and never keep it, even if it’s small.","I keep it safe and hand it over with a written report so it can be returned."],
["I say, “Housekeeping, may I clean your room now?” If not, I come back later.","I respect the Do Not Disturb sign and return when the guest is out."],
["I take notes and a photo and tell my supervisor, so the guest isn’t blamed wrongly.","I report it immediately so maintenance can repair it and the room status can be updated."],
["It reflects the hotel’s standards and helps guests sleep well.","A neat bed gives a good first impression and shows we care about detail."],
["I follow the SOP, wear protective equipment, and report broken tools.","I never mix chemicals and I always read the label."],
["I stay calm and finish the most urgent rooms first, then report the rest.","I communicate early so my supervisor can arrange help. I stay honest."]],
f:[["They give friendly service and make sure guests’ needs are met.","They set tables, serve, clear plates, and keep the dining area clean."],
["I enjoy teamwork and the energy of a restaurant.","It’s the best place to practice my English and guest handling."],
["“Good morning, welcome. A table for how many?”","“Welcome to ___. Please follow me, I’ll show you to your table.”"],
["“Excuse me, I’ll check the ingredients and be right back.”","I ask my supervisor or the kitchen, then give an accurate answer."],
["I thank the guest for telling me and replace the dish quickly.","I apologize, check the order with the kitchen, and make sure it’s right this time."],
["I use tongs or gloves, don’t touch glass rims, and wipe tables with sanitizer.","Clean hands, clean uniform, clean station."],
["I take a deep breath, set priorities, and serve the guests who have waited longest first.","I help my team and keep smiling, so guests still feel cared for."],
["I use both hands, keep it level, and check the floor for wet spots.","I never overload the tray and I use a tray stand when needed."],
["Recommending a bigger size, a side dish, or the chef’s special.","“Would you like to add garlic bread to your pasta?”"],
["I keep a calm voice, apologize, and ask my supervisor to help.","I move the guest to a quiet area if possible and keep other guests comfortable."]],
b:[["I love learning the art of drinks and talking with guests.","The bar is where I can be creative and learn product knowledge."],
["Makes classic cocktails, manages stock, and serves guests responsibly.","Mixes drinks by recipe and keeps the bar organized."],
["Classic ones like Mojito and Margarita, plus mocktails.","I know the basic cocktails and I study new recipes every week."],
["Shaking chills fast, stirring keeps drinks clear, building is simple and quick.","For example: Margarita is shaken, Negroni is stirred, Gin Tonic is built."],
["“I’m sorry, I can’t serve more. May I offer you water or coffee?”","I follow responsible service of alcohol and call my supervisor."],
["“May I see your ID, please?” I follow the law and hotel policy.","If I’m unsure, I don’t serve, and I explain politely."],
["I sanitize tools, change ice and cloths, and clean spills right away.","Clean as you go: wipe, rinse, restock."],
["I stay organized, make several drinks at once, and keep guests informed.","I ask the floor team to help with garnish, ice, and glass polishing."],
["I tell my supervisor if needed, correct it, and double-check recipes next time.","I remake it quickly and never blame others."],
["“Our signature cocktail is very popular. Would you like to try it?”","I ask about the guest’s taste, then suggest a drink that fits and mention the price."]],
r:[["Welcomes guests, manages bookings, and answers questions.","Acts as the information center and problem solver at the front desk."],
["I enjoy communication and the fast pace of the front desk.","I want to learn hotel operations from the first point of contact."],
["“Welcome, may I have your reservation name, please?”","“Good evening, welcome. Did you have a pleasant journey?”"],
["I ask for the booking confirmation and search by email or phone number.","If the hotel is full, I inform my supervisor to find an alternative."],
["“I apologize. Let me check another room for you.”","I thank the guest for the feedback and follow up later."],
["I smile while speaking, because the guest can hear it.","I say the greeting, listen, and repeat the guest’s request."],
["“I’ll check with my supervisor. Would 2 p.m. be alright?”","“Our standard check-out is at 12; I’ll see what we can arrange.”"],
["I make eye contact with the next guest and stay calm.","I prioritize, ask for help, and avoid long conversations."],
["I protect guest privacy and offer to take a message.","I suggest the person contact the guest directly."],
["ID, reservation, payment, and a signed registration card.","I confirm the name, stay dates, room type, and payment method."]]};

g:[["Where do you see yourself in five years?","As a skilled hotelier, maybe a supervisor, always learning.","Working in a respected hotel with more responsibility.","Growing from OJT to a professional in hospitality, and maybe leading a team."],
["Why should we choose you?","I’m disciplined, humble, and quick to learn.","I’ll give my best effort and respect your standards.","I bring energy and a positive attitude to the team."],
["Describe a time you worked in a team.","At a school event, I managed the welcome desk while my team handled the food. We finished on time.","I helped classmates during practice, and we passed our service test together.","In a group project, I took the task nobody wanted and it helped the team succeed."],
["Do you have any questions for us?","What will my daily tasks be?","Who will guide me during my OJT?","What qualities do you look for in a great trainee?"]],
h:[["How do you make a bed?","Start with the fitted sheet, add the flat sheet, duvet, then pillows, and smooth every layer.","I tuck the corners neatly, center the duvet, and place the pillows correctly.","I follow the hotel standard: tight sheets, no wrinkles, and a neat finish."],
["A guest asks for extra towels. What do you do?","“Certainly, I’ll bring them right away.”","I check the stock and deliver within 10 minutes.","I note the room number and confirm delivery with the guest."],
["How do you clean a bathroom?","Spray, wait, scrub the toilet, sink, and shower, then wipe and shine; floor last.","I use separate cloths for toilet and sink to avoid cross-contamination.","I check for hair and spots and refill amenities as the last step."]],
f:[["How do you set a table?","Place a clean cloth, plates, cutlery from outside to inside, glasses, and napkin.","I check every item for cleanliness and align them evenly.","I follow the restaurant’s style, then do a last check before guests arrive."],
["How do you take an order?","Greet, present the menu, listen, repeat the order, and confirm.","I write down seat numbers and details, mention allergies, and send it to the kitchen.","I suggest specials, repeat clearly, and tell the guest when the food will arrive."],
["A guest has a food allergy. What do you do?","I take it seriously, ask for details, and tell the kitchen.","I never guess. I check the ingredients with the chef.","I mark the order as “allergy” and confirm before serving."]],
b:[["What is a mocktail? Give an example.","A drink without alcohol, like a Virgin Mojito.","A mix of juice, syrup, and soda, like a Shirley Temple.","A good option for guests who don’t drink, like a Virgin Piña Colada."],
["What is a garnish and why is it important?","A garnish decorates a drink, like lime or mint.","It adds aroma and makes the drink look attractive.","It must be fresh and clean because guests see it first."],
["How do you prepare the bar at the start of your shift?","I check stock, ice, glasses, and tools.","I cut fruits, refill bottles, and set up my station.","I check par stock and report shortages."]],
r:[["How do you handle a check-out?","I ask about the stay, check the bill, take payment, and thank the guest.","I confirm the minibar, collect the key card, and invite the guest back.","I print the invoice, check the details, and wish the guest a safe trip."],
["What would you do if a guest wants to change rooms?","I ask the reason and check availability.","I apologize, offer options, and inform Housekeeping.","I update the system after the move and give the new key card."],
["A guest asks for local recommendations. What do you say?","I suggest places nearby, give directions, and offer a map.","I ask what they like, then suggest two or three options.","I can arrange a taxi or tour if requested."]]};

["Saat interview",["Senyum, kontak mata, dan duduk tegak.","Jawab dengan pola S-T-A-R: Situation, Task, Action, Result.","Kalau tidak tahu jawabannya, jujur dan tunjukkan semangat belajar.","Jangan menjelekkan sekolah, tempat kerja lama, atau orang lain."]],
["Trik jawaban situasi",["Pola andalan: Listen → Apologize → Solve → Inform supervisor.","Utamakan keselamatan guest dan kejujuran.","Sebut kata kunci: guest first, teamwork, hygiene, safety, honesty.","Tutup jawaban dengan hasil: “Then the guest was happy.”"]],
["Frasa berguna",["“May I help you?” · “My pleasure.”","“I apologize for the inconvenience.”","“Let me check that for you.”","“Please wait a moment.” · “Thank you for your patience.”"]],

var tab="top",open={};
function qa(k,i){return D[k][i]}
function item(k,i,showTag){var a=qa(k,i),id=k+i;
return '<div class="item'+(open[id]?' open':'')+'" data-id="'+id+'"><button aria-expanded="'+(!!open[id])+'"><span class="t">'+(showTag?'<span class="tag">'+S[k]+'</span>':'')+a[0]+'</span><span class="ar">›</span></button><div class="ans">'+a.slice(1).map(function(x,j){return '<p><span class="op">Contoh '+(j+1)+'</span>'+x+'</p>'}).join("")+'</div></div>'}
function render(){
var m=document.getElementById("m"),h="",s=document.getElementById("q").value.trim().toLowerCase();
if(s){var n=0;h='<p class="intro">Hasil pencarian untuk “'+s.replace(/</g,"")+'”</p>';
for(var k in D)D[k].forEach(function(a,i){if(a.join(" ").toLowerCase().indexOf(s)>-1){h+=item(k,i,1);n++}});
if(!n)h='<div class="none">Tidak ada hasil. Coba kata kunci lain, misalnya “guest” atau “clean”.</div>'}
else if(tab=="top"){h='<p class="intro">10 pertanyaan yang paling sering muncul. Kuasai ini dulu!</p>';TOP.forEach(function(t){h+=item(t[0],+t.slice(1),1)})}
else if(tab=="tips"){TIPS.forEach(function(c){h+='<div class="card"><h3>'+c[0]+'</h3><ul>'+c[1].map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul></div>"})}
else{h='<p class="intro">'+D[tab].length+' pertanyaan '+S[tab]+'. Tap untuk melihat contoh jawaban.</p>';D[tab].forEach(function(a,i){h+=item(tab,i,0)})}
m.innerHTML=h}
function tabs(){var T=[["top","Top 10"],["g","Umum"],["f","F&B"],["h","Housekeeping"],["b","Bar"],["r","Reception"],["tips","Tips & Trik"]];
document.getElementById("tabs").innerHTML=T.map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]==tab)+'">'+t[1].replace("&","&amp;")+'</button>'}).join("")}
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.getElementById("q").value="";tabs();render();window.scrollTo(0,0)});
document.getElementById("m").addEventListener("click",function(e){var it=e.target.closest(".item");if(!it||!e.target.closest("button"))return;var id=it.dataset.id;open[id]=!open[id];it.classList.toggle("open");it.querySelector("button").setAttribute("aria-expanded",!!open[id])});
document.getElementById("q").addEventListener("input",render);
tabs();render();
</script>
